<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Livro</title>
</head>
    <body>
        <h1>Cadastro de Livros</h1>
        <form th:action="@{/livros/exibir}" th:object="${livro}" method="post">

            <label> Título:</label>
            <input type="text" th:field="*{titulo}" />

            <label>Autor:</label>
            <input type="text" th:field="*{autor}" />

            <label>ISBN:</label>
            <input type="text" th:field="*{isbn}" />

            <button type="submit">Cadastrar</button>

            <label>Categoria:</label>
            <select     th:field="*{categoria}">
                <option th:each="cat : ${categoria}" th:value="${cat}" th:text="${cat}"></option>
            </select>

        </form>
        <hr>
        <h3>Livros Cadastrados:</h3>
        <ul>
            <li th:each="item : ${listaLivros}">
                <strong th:text="${item.titulo}"></strong> - <span th:text="${item.autor}"></span> - <span th:text="${item.categoria}"></span>
            </li>
        </ul>

    </body>
</html>
